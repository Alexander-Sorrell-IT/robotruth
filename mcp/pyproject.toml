[project]
name = "robotruth-mcp"
version = "0.1.0"
description = "RoboTruth MCP server — did the robot lie? Audit a GitHub PR inside your agent."
requires-python = ">=3.11"
dependencies = ["robotruth", "mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
robotruth-mcp = "robotruth_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["robotruth_mcp*"]

# uv (for installers) resolves the engine from the repo's robotruth/ subdir.
[tool.uv.sources]
robotruth = { git = "https://github.com/Alexander-Sorrell-IT/robotruth.git", subdirectory = "robotruth", branch = "main" }
