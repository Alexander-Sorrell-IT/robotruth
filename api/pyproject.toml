[project]
name = "robotruth-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "robotruth", "redis>=5"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["."]
include = ["robotruth_api*"]

# Vercel: deploy the FastAPI app (robotruth_api/app.py -> `app`) as one function.
[tool.vercel]
entrypoint = "robotruth_api.app:app"

# uv (used by Vercel's Python build) resolves the `robotruth` engine from this
# repo's robotruth/ subdirectory. pip ignores this block, so local dev (which
# installs the engine editable from ../robotruth) is unaffected.
[tool.uv.sources]
robotruth = { git = "https://github.com/Alexander-Sorrell-IT/robotruth.git", subdirectory = "robotruth", branch = "main" }
